# Several Claude Code sessions in named windows and panes that outlive the
# terminal window. Ghostty opens straight into the session "main", see
# ghostty/config.

# True colour, so the starship prompt looks the same as outside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Click to focus a pane, wheel to scroll back. A border cannot be dragged: the panes
# always share the width evenly, and a stray drag would leave one squeezed.
set -g mouse on
unbind -n MouseDrag1Border
set -g history-limit 100000

# The panes of a window stand side by side, evenly wide, whatever opens, closes or
# resizes them.
set-hook -g after-split-window 'select-layout even-horizontal'
set-hook -g pane-exited 'select-layout even-horizontal'
set-hook -g client-resized 'select-layout even-horizontal'

# Windows and panes count from 1, and close the gap when one goes away.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Escape, focus changes and modified keys reach the program at once.
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Links reach Ghostty as links (OSC 8): without the feature tmux strips them, and a link
# printed by Claude Code arrives as plain text.
set -as terminal-features ",xterm-ghostty:hyperlinks,xterm-256color:hyperlinks"

# Ctrl+click opens the link under the mouse, as Ghostty does outside tmux: with the
# mouse on, tmux takes that click too and Ghostty never sees it. Anything that is not a
# link gets a plain click. Ctrl+Shift+click still goes straight to Ghostty.
bind -n C-MouseDown1Pane if-shell "~/Projects/devtia/dotfiles/bin/tmux-open-link x#{q:mouse_hyperlink} x#{q:mouse_line} #{mouse_x}" "" "select-pane -t= ; send -M"

# A copy in tmux lands in the system clipboard (OSC 52).
set -g set-clipboard on

# A window keeps the name it was opened with; programs cannot retitle it.
set -g allow-rename off

# Every pane carries its title on its top border: the name Claude Code gives the
# session (`claude -n`), so side-by-side sessions can be told apart at a glance.
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "

# The terminal window shows the session and the window.
set -g set-titles on
set -g set-titles-string "#S · #W"

# New windows and panes start in the directory of the current pane.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
